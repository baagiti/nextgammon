# ══════════════════════════════════════════════════════════════════════════════
#  NEXTGAMMON — codemagic.yaml
#  iOS App Store (TestFlight)
#  Docs: https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/
# ══════════════════════════════════════════════════════════════════════════════

workflows:

  # ────────────────────────────────────────────────────────────────────────────
  #  1. iOS — App Store (TestFlight)
  # ────────────────────────────────────────────────────────────────────────────
  ios-app-store:
    name: "NEXTGAMMON iOS — App Store"
    max_build_duration: 60  # minutes
    instance_type: mac_mini_m2  # Codemagic cloud Mac (free tier: 500 min/month)

    # ── App Store Connect API integration (Codemagic UI → Teams → Integrations
    #    → Developer Portal → "Codemagic Admin" key, Admin role — needed for
    #    automatic certificate/profile management) — used for automatic code
    #    signing and the TestFlight publishing step below. ──
    integrations:
      app_store_connect: Codemagic Admin

    environment:
      # ── Xcode & Node Versions ──
      xcode: latest
      node: "22"

      # ── Code Signing (auto-managed via the App Store Connect API key above —
      #    reuses the account's existing App Store distribution certificate,
      #    which already backs several other apps; the matching "NEXTGAMMON App
      #    Store" provisioning profile was created once by hand in the Developer
      #    Portal so this step has something to find). ──
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.burakakkaya.nextgammon

      vars:
        APP_NAME: "NEXTGAMMON"
        BUNDLE_ID: "com.burakakkaya.nextgammon"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

    triggering:
      events:
        - tag        # auto-build when you push a git tag (e.g. v1.0.0)
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      # 1. Install Node dependencies
      - name: Install npm dependencies
        script: npm ci

      # 2. Build Vite web bundle
      - name: Build web app
        script: npm run build

      # 3. Sync Capacitor web assets → iOS native project
      - name: Capacitor sync iOS
        script: npx cap sync ios

      # 4. Set app version from git tag (e.g. v1.2.3 → 1.2.3)
      - name: Set version from git tag
        script: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION=${LATEST_TAG#v}
          echo "Setting version: $VERSION"
          agvtool new-marketing-version "$VERSION"
          agvtool new-version -all $(($(git rev-list --count HEAD)))
        working_directory: ios/App

      # 5. Archive & export IPA for App Store
      - name: Build IPA (App Store)
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-directory "$CM_BUILD_DIR"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Auto-publish to TestFlight on every successful build
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false   # ← set to true for direct App Store release

      # Email notification on build success/failure
      email:
        recipients:
          - burakakkayaa@gmail.com
        notify:
          success: true
          failure: true


  # ────────────────────────────────────────────────────────────────────────────
  #  2. Android — Google Play (tablet-only, production track)
  # ────────────────────────────────────────────────────────────────────────────
  android-play-store:
    name: "NEXTGAMMON Android — Google Play"
    max_build_duration: 60  # minutes
    instance_type: linux_x2

    environment:
      node: "22"
      java: 21
      # ── "android_signing" variable group (Codemagic UI → this app → Environment
      #    variables): ANDROID_KEYSTORE_BASE64 (the upload keystore, base64-encoded —
      #    binaries can't be pasted as plain vars), ANDROID_KEYSTORE_PASSWORD,
      #    ANDROID_KEY_ALIAS, and GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (the Play
      #    Developer API service account JSON, pasted as-is — used below to publish). ──
      groups:
        - android_signing

    triggering:
      events:
        - tag        # auto-build when you push a git tag (e.g. v1.0.0) — same tags as iOS
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      # 1. Install Node dependencies
      - name: Install npm dependencies
        script: npm ci

      # 2. Build Vite web bundle
      - name: Build web app
        script: npm run build

      # 3. Sync Capacitor web assets → Android native project
      - name: Capacitor sync Android
        script: npx cap sync android

      # 4. Set app version from git tag (e.g. v1.2.3 → versionName 1.2.3), and
      #    versionCode from the commit count (matches the iOS build-number scheme).
      - name: Set version from git tag
        script: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "ANDROID_VERSION_NAME=${LATEST_TAG#v}" >> $CM_ENV
          echo "ANDROID_VERSION_CODE=$(git rev-list --count HEAD)" >> $CM_ENV

      # 5. Decode the base64 upload keystore to a file build.gradle can sign with
      #    (see android/app/build.gradle's signingConfigs.release, which reads
      #    ANDROID_KEYSTORE_PATH/ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS).
      - name: Decode signing keystore
        script: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > $CM_BUILD_DIR/nextgammon-upload-key.jks
          echo "ANDROID_KEYSTORE_PATH=$CM_BUILD_DIR/nextgammon-upload-key.jks" >> $CM_ENV

      # 6. Build the signed release App Bundle
      - name: Build AAB (Google Play)
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt

    publishing:
      # Auto-publish straight to production (tablet-only distribution comes from
      # AndroidManifest.xml's <supports-screens requiresSmallestWidthDp="600">,
      # not from anything here — Google Play reads that from the AAB itself).
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: false

      email:
        recipients:
          - burakakkayaa@gmail.com
        notify:
          success: true
          failure: true


  # ────────────────────────────────────────────────────────────────────────────
  #  3. Development Build (fast, no signing, just verify it builds)
  # ────────────────────────────────────────────────────────────────────────────
  dev-build-check:
    name: "NEXTGAMMON — Dev Build Check"
    max_build_duration: 15
    instance_type: linux_x2

    environment:
      node: "22"

    triggering:
      events:
        - push          # run on every push to main/dev branches
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
        - pattern: dev
          include: true

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: TypeScript lint check
        script: npm run lint

      - name: Production build
        script: npm run build

      - name: Verify dist output
        script: |
          if [ -f "dist/index.html" ]; then
            echo "✅ Build successful — dist/index.html exists"
          else
            echo "❌ Build failed — dist/index.html not found"
            exit 1
          fi
